name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # The collector contract suite reads live sensors. A GitHub runner is a VM with no
      # fans, no battery and no SMC, so those tests are skipped here and belong on real
      # hardware. Run `swift test` locally before you push.
      - name: Test
        run: swift test --skip CollectorContract

      - name: Assemble the app bundle
        run: Scripts/build.sh

      - name: Render every surface
        run: .build/debug/AirStat --render --out render

      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: render/
